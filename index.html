<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050b08">
<title>WearSynapse Demo</title>
<meta property="og:title" content="Hi YC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050b08; --ink: #eef3f0; --muted: #7f9188; --line: rgba(255,255,255,.14);
    --trace: #3dff8f; --yc: #ff6600; --err: #ff5a4e;
    --card: #fffdf9; --card-ink: #1b1b1d; --card-line: #e4dfd5; --brand: #2747d6; --ok: #1f8a5b;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink);
         font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  /* The monitor: a live canvas behind everything */
  #monitor { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 600ms ease; }
  body.watching #monitor { opacity: .18; }
  /* faint monitor grid + vignette */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%),
      linear-gradient(rgba(61,255,143,.035) 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, rgba(61,255,143,.035) 1px, transparent 1px) 0 0 / 40px 100%; }

  .hr { position: fixed; top: 18px; right: 20px; z-index: 2; font: 500 13px/1 "JetBrains Mono", ui-monospace, monospace;
        color: var(--trace); display: flex; align-items: baseline; gap: 8px; letter-spacing: .04em; }
  .hr b { font-size: 34px; font-weight: 500; min-width: 2.2ch; text-align: right; }
  .hr i { font-style: normal; display: inline-block; transition: transform 120ms var(--ease-out); }
  .hr i.pulse { transform: scale(1.35); }
  body.err .hr { color: var(--err); }

  main { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh; display: grid;
         grid-template-columns: minmax(0, 1fr); place-items: center; padding: 72px 16px 34vh; }
  body.watching main { padding-bottom: 72px; }
  .step { display: none; width: 100%; }
  .step.show { display: block; animation: rise 500ms var(--ease-out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } }
  .shake { animation: shake 320ms var(--ease-out); }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

  /* 1. Password */
  #gate { max-width: 400px; text-align: center; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(72px, 16vw, 112px);
       line-height: 1; letter-spacing: -.01em; margin: 0 0 30px; }
  h1 em { color: var(--yc); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
          background: rgba(255,255,255,.05); color: var(--ink); outline: none; backdrop-filter: blur(6px);
          transition: border-color 160ms ease, box-shadow 160ms ease; }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--trace); box-shadow: 0 0 0 3px rgba(61,255,143,.15); }
  button { font: inherit; font-weight: 500; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--ink); color: #07100c;
           cursor: pointer; white-space: nowrap; transition: transform 160ms var(--ease-out), background 160ms ease; }
  button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { button:hover { background: #fff; } }
  .msg { min-height: 22px; margin-top: 12px; font: 500 13px/1.5 "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }
  .msg.err { color: var(--err); }

  /* 2. Captcha (light card on the dark monitor) */
  #check { max-width: 440px; }
  .box { background: var(--card); color: var(--card-ink); border-radius: 14px; overflow: hidden;
         box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 80px -20px rgba(0,0,0,.8); }
  .top { background: var(--brand); color: #fff; padding: 18px 20px; }
  .top small { display: block; font-size: 12px; opacity: .8; }
  .top b { display: block; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.15; }
  .opts { padding: 14px; display: grid; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 10px;
         border: 1px solid var(--card-line); background: #fff; color: var(--card-ink); font-weight: 400; }
  @media (hover: hover) and (pointer: fine) { .opt:hover { background: #fff; border-color: var(--brand); } }
  .tickbox { flex: none; width: 22px; height: 22px; border: 2px solid #b9b4aa; border-radius: 4px; display: grid; place-items: center;
             transition: background 160ms ease, border-color 160ms ease; }
  .tickbox svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20;
                 transition: stroke-dashoffset 260ms var(--ease-out) 60ms; }
  .opt.right { border-color: var(--ok); } .opt.right .tickbox { background: var(--ok); border-color: var(--ok); }
  .opt.right .tickbox svg { stroke-dashoffset: 0; }
  .opt.wrong { border-color: #d8a291; }
  .fact { display: none; margin: 0 14px 14px; padding: 16px; border-radius: 10px; background: #eef1fc; }
  .fact.show { display: block; animation: rise 400ms var(--ease-out) both; }
  .fact p { margin: 0 0 12px; font-family: "Instrument Serif", Georgia, serif; font-size: 24px; line-height: 1.2; }
  .fact p b { font-weight: 400; color: var(--brand); }
  .fact button { width: 100%; background: var(--card-ink); color: #fff; }
  .nope { margin: -4px 16px 12px; font-size: 14px; color: #b4361b; }
  .nope:empty { margin: 0; }

  /* 3. Film */
  #film { max-width: 1040px; }
  #film video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: #000;
                box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 100px -30px rgba(0,0,0,.9); }

  @media (max-width: 480px) { form { flex-direction: column; } .hr b { font-size: 26px; } }
  @media (prefers-reduced-motion: reduce) {
    .step.show, .fact.show { animation: fade 200ms ease both; }
    @keyframes fade { from { opacity: 0; } }
    .shake { animation: none; }
  }
</style>
</head>
<body>
<canvas id="monitor" aria-hidden="true"></canvas>
<div class="hr" aria-hidden="true"><i id="heart">♥</i><b id="bpm">72</b>bpm</div>

<main>
  <div class="step show" id="gate">
    <h1>Hi <em>YC</em>,</h1>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" aria-label="Password" required>
      <button id="go">Enter</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="step" id="check" role="group" aria-labelledby="q">
    <div class="box">
      <div class="top"><small id="qn">Quick check, 1 of 2</small><b id="q"></b></div>
      <div class="opts" id="opts"></div>
      <div class="nope" id="nope" role="status"></div>
      <div class="fact" id="fact"><p id="factText"></p><button id="next" type="button"></button></div>
    </div>
  </div>

  <div class="step" id="film"><video id="v" controls playsinline></video></div>
</main>

<script>
const $ = id => document.getElementById(id);

/* ───────── The monitor ─────────
   A sweeping ECG like a bedside monitor. Each column of pixels stores the trace height
   written when the sweep last passed it; a gap is erased just ahead of the sweep head.
   Beats come from a 72 bpm pacemaker, from every key the visitor types, or from the
   mode (an irregular red rhythm on a wrong password). */
const monitor = (() => {
  const cv = $('monitor'), cx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = 260, GAP = 46;                      // px per second, erased gap ahead of head
  let W, H, dpr, col, red, head = 0, last = performance.now();
  let beats = [], nextAuto = 0, mode = 'normal', modeUntil = 0, typed = [];

  const g = (t, mu, sd, a) => a * Math.exp(-((t - mu) ** 2) / (2 * sd * sd));
  // One PQRST complex, t in seconds since the beat began
  const pqrst = t => t < 0 || t > .7 ? 0 :
    g(t, .10, .025, .10) + g(t, .19, .008, -.12) + g(t, .215, .010, 1) + g(t, .24, .011, -.28) + g(t, .43, .045, .22);
  const noise = t => Math.sin(t * 7.1) * .006 + Math.sin(t * 23.7) * .004;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const old = col; col = new Float32Array(Math.ceil(W) + 1).fill(NaN);
    if (old) col.set(old.subarray(0, Math.min(old.length, col.length)));
    red = new Uint8Array(col.length);
    if (reduce) { for (let x = 0; x < col.length; x++) col[x] = sample(x / SPEED + 10); draw(); }
  }

  function beat(now) {
    if (beats.length && now - beats[beats.length - 1] < 230) return;   // refractory period
    beats.push(now); if (beats.length > 8) beats.shift();
    const h = $('heart'); h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
    setTimeout(() => h.classList.remove('pulse'), 140);
    // heart rate from the last few intervals
    if (beats.length > 2) {
      const iv = (beats[beats.length - 1] - beats[0]) / (beats.length - 1);
      $('bpm').textContent = Math.max(40, Math.min(180, Math.round(60000 / iv)));
    }
  }

  function sample(tSec) {
    const now = tSec * 1000;
    if (mode === 'vf') return Math.sin(tSec * 31) * .22 + Math.sin(tSec * 47 + 1) * .16 + Math.sin(tSec * 13) * .1;
    let y = noise(tSec);
    for (const b of beats) y += pqrst((now - b) / 1000);
    return y;
  }

  function step(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (mode === 'vf' && now > modeUntil) { mode = 'normal'; document.body.classList.remove('err'); beats = []; nextAuto = now + 300; }
    if (mode === 'normal') {
      const recentTyping = typed.length && now - typed[typed.length - 1] < 1500;
      if (!recentTyping && now >= nextAuto) { beat(now); nextAuto = now + 60000 / 72; }
      if (!recentTyping && now - (beats[beats.length - 1] || 0) > 2000) $('bpm').textContent = 72;
    }
    const from = head; head += SPEED * dt;
    for (let x = Math.floor(from); x < Math.floor(head); x++) {
      const t = (now - (head - x) / SPEED * 1000) / 1000;
      col[x % col.length] = sample(t); red[x % col.length] = mode === 'vf' ? 1 : 0;
    }
    if (head >= col.length) head -= col.length;
    for (let k = 1; k <= GAP; k++) col[(Math.floor(head) + k) % col.length] = NaN;
    draw();
    requestAnimationFrame(step);
  }

  function draw() {
    cx.clearRect(0, 0, W, H);
    const base = document.body.classList.contains('watching') ? H * .5 : H * .74, amp = Math.min(150, H * .17);
    const RED = '255,90,78', GREEN = '61,255,143', color = mode === 'vf' ? RED : GREEN;
    const hx = Math.floor(head);
    // trace in segments: brighter near the head, dimmer the older it is
    for (let s = 0; s < col.length; s += 24) {
      const age = ((hx - s + col.length) % col.length) / col.length;
      cx.beginPath(); let pen = false;
      for (let x = s; x <= Math.min(s + 24, col.length - 1); x++) {
        const v = col[x]; if (Number.isNaN(v)) { pen = false; continue; }
        const y = base - v * amp; pen ? cx.lineTo(x, y) : cx.moveTo(x, y); pen = true;
      }
      const a = 1 - age * .75, sc = red[s] ? RED : GREEN;
      cx.strokeStyle = `rgba(${sc},${a * .16})`; cx.lineWidth = 7; cx.lineJoin = cx.lineCap = 'round'; cx.stroke();
      cx.strokeStyle = `rgba(${sc},${a})`; cx.lineWidth = 1.8; cx.stroke();
    }
    // glowing head
    const hv = col[(hx - 1 + col.length) % col.length];
    if (!reduce && !Number.isNaN(hv)) {
      const y = base - hv * amp, grd = cx.createRadialGradient(hx, y, 0, hx, y, 22);
      grd.addColorStop(0, `rgba(${color},.9)`); grd.addColorStop(1, `rgba(${color},0)`);
      cx.fillStyle = grd; cx.fillRect(hx - 22, y - 22, 44, 44);
    }
  }

  addEventListener('resize', resize); resize();
  if (!reduce) requestAnimationFrame(t => { last = t; nextAuto = t + 400; requestAnimationFrame(step); });

  return {
    key() { const n = performance.now(); typed.push(n); if (typed.length > 10) typed.shift(); if (mode === 'normal') beat(n); },
    wrong() { mode = 'vf'; modeUntil = performance.now() + 1400; document.body.classList.add('err'); },
  };
})();

$('pw').addEventListener('keydown', e => { if (e.key.length === 1 || e.key === 'Backspace') monitor.key(); });

/* ───────── Password → unlock ───────── */
const go = (from, to) => { $(from).classList.remove('show'); $(to).classList.add('show'); };
const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

let pct = 0;
const locked = (async () => {
  const r = await fetch('demo.bin'); if (!r.ok) throw new Error('fetch');
  const total = +r.headers.get('content-length') || 8000000, reader = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; pct = Math.min(99, Math.round(got / total * 100)); }
  pct = 100; return new Blob(parts).arrayBuffer();
})();
locked.catch(() => {});

// check.bin is a few bytes locked with the same password and salt as the film,
// so the password is verified instantly and the captcha runs while the film downloads.
const checkFile = fetch('check.bin').then(r => { if (!r.ok) throw new Error('fetch'); return r.arrayBuffer(); });
checkFile.catch(() => {});
let filmReady = null;   // resolves once the film is decrypted and loaded into the player

$('f').onsubmit = async e => {
  e.preventDefault();
  const btn = $('go'), msg = $('msg');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '';
  let chk;
  try { chk = new Uint8Array(await checkFile); }
  catch { msg.className = 'msg err'; msg.textContent = 'Couldn’t load. Please refresh.'; btn.disabled = false; return; }
  let key;
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
    key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: chk.slice(0, 16), iterations: 600000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: chk.slice(16, 28) }, key, chk.slice(28));
  } catch {
    monitor.wrong();
    msg.className = 'msg err'; msg.textContent = 'Wrong password.';
    shake($('gate')); btn.disabled = false; $('pw').select(); return;
  }
  // Right password: start the captcha now, unlock the film behind it
  filmReady = (async () => {
    const blob = new Uint8Array(await locked);
    const mp4 = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
    $('v').src = URL.createObjectURL(new Blob([mp4], { type: 'video/mp4' }));
  })();
  filmReady.catch(() => {});
  go('gate', 'check'); ask(0);
};

/* ───────── Captcha: both answers are the doctor; each reveals one fact ───────── */
const QUESTIONS = [
  { q: 'Who made this film?', fact: 'Dr. Piyush has spent <b>5,000+ hours</b> building with AI.', next: 'Next' },
  { q: 'Who built the software in it?', fact: 'Dr. Piyush led <b>medical AI strategy</b> at Redcliffe Labs (YC W21).', next: 'Play the film' },
];
const OPTIONS = [{ label: 'The medical doctor', right: true }, { label: 'The AI builder', right: false }];
const svgTick = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function ask(i) {
  const { q, fact, next } = QUESTIONS[i];
  $('qn').textContent = `Quick check, ${i + 1} of 2`; $('q').textContent = q;
  $('nope').textContent = ''; $('fact').classList.remove('show');
  $('factText').innerHTML = fact; $('next').textContent = next;
  $('opts').innerHTML = '';
  for (const o of OPTIONS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.innerHTML = `<span class="tickbox">${svgTick}</span><span>${o.label}</span>`;
    b.onclick = () => {
      if (!o.right) { b.classList.add('wrong'); $('nope').textContent = 'Try again.'; shake($('check')); monitor.wrong(); return; }
      $('opts').querySelectorAll('button').forEach(x => { x.disabled = true; x.classList.remove('wrong'); });
      b.classList.add('right'); $('nope').textContent = ''; $('fact').classList.add('show'); monitor.key();
    };
    $('opts').append(b);
  }
  $('next').onclick = async () => {
    if (i + 1 < QUESTIONS.length) { $('check').classList.remove('show'); void $('check').offsetWidth; $('check').classList.add('show'); return ask(i + 1); }
    if (!$('v').src) {
      // Film still on its way: show progress, then ask for one more tap so the browser allows sound
      const btn = $('next'); btn.disabled = true;
      const tick = () => { btn.textContent = pct < 100 ? `Loading the film… ${pct}%` : 'Unlocking…'; };
      tick(); const timer = setInterval(tick, 200);
      try { await filmReady; } catch { clearInterval(timer); btn.textContent = 'Couldn’t load. Please refresh.'; return; }
      clearInterval(timer); btn.disabled = false; btn.textContent = 'Play the film'; return;
    }
    document.body.classList.add('watching');
    go('check', 'film'); $('v').play().catch(() => {});   // inside the click, so sound is allowed
  };
}
</script>
</body>
</html>
