<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WearSynapse Demo</title>
<meta property="og:title" content="Hi YC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f4ee; --card: #fffdf9; --ink: #1b1b1d; --muted: #6d6a65; --line: #e4dfd5;
    --brand: #2747d6; --yc: #ff6600; --ok: #1f8a5b; --err: #b4361b;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; background: var(--paper); color: var(--ink);
         font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow-x: hidden; }

  /* Heartbeat strip */
  .ecg { height: 92px; overflow: hidden; position: relative;
         mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
         -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .ecg svg { position: absolute; left: 0; top: 0; width: 2400px; height: 92px; animation: sweep 6s linear infinite; }
  .ecg path { fill: none; stroke: var(--yc); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke 400ms ease; }
  body.unlocked .ecg svg { animation-duration: 2.4s; }
  body.unlocked .ecg path { stroke: var(--ok); }
  @keyframes sweep { to { transform: translateX(-1200px); } }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 0 16px 120px; }
  .step { display: none; width: 100%; }
  .step.show { display: block; animation: rise 500ms var(--ease-out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .shake { animation: shake 320ms var(--ease-out); }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

  /* 1. Password */
  #gate { max-width: 400px; text-align: center; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(64px, 14vw, 96px);
       line-height: 1; letter-spacing: -.01em; margin: 0 0 28px; }
  h1 em { color: var(--brand); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
          background: #fff; color: var(--ink); outline: none; transition: border-color 160ms ease, box-shadow 160ms ease; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(39,71,214,.14); }
  button { font: inherit; font-weight: 500; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--ink); color: #fff;
           cursor: pointer; white-space: nowrap; transition: transform 160ms var(--ease-out), background 160ms ease; }
  button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { button:hover { background: #000; } }
  .msg { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--err); }

  /* 2. Captcha */
  #check { max-width: 440px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
         box-shadow: 0 12px 32px -18px rgba(40,30,10,.25); }
  .top { background: var(--brand); color: #fff; padding: 18px 20px; }
  .top small { display: block; font-size: 12px; opacity: .8; }
  .top b { display: block; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.15; }
  .opts { padding: 14px; display: grid; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 10px;
         border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 400; }
  @media (hover: hover) and (pointer: fine) { .opt:hover { background: #fff; border-color: var(--brand); } }
  .tickbox { flex: none; width: 22px; height: 22px; border: 2px solid #b9b4aa; border-radius: 4px; display: grid; place-items: center;
             transition: background 160ms ease, border-color 160ms ease; }
  .tickbox svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20;
                 transition: stroke-dashoffset 260ms var(--ease-out) 60ms; }
  .opt.right { border-color: var(--ok); } .opt.right .tickbox { background: var(--ok); border-color: var(--ok); }
  .opt.right .tickbox svg { stroke-dashoffset: 0; }
  .opt.wrong { border-color: #d8a291; }
  .fact { display: none; margin: 0 14px 14px; padding: 16px; border-radius: 10px; background: #eef1fc; }
  .fact.show { display: block; animation: rise 400ms var(--ease-out) both; }
  .fact p { margin: 0 0 12px; font-family: "Instrument Serif", Georgia, serif; font-size: 24px; line-height: 1.2; }
  .fact p b { font-weight: 400; color: var(--brand); }
  .fact button { width: 100%; }
  .nope { min-height: 0; margin: -4px 16px 12px; font-size: 14px; color: var(--err); }
  .nope:empty { margin: 0; }

  /* 3. Film */
  #film { max-width: 1040px; }
  #film video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: #000;
                box-shadow: 0 24px 60px -24px rgba(20,15,5,.45); }

  @media (max-width: 480px) { form { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) {
    .ecg svg { animation: none; }
    .step.show, .fact.show { animation: fade 200ms ease both; }
    @keyframes fade { from { opacity: 0; } }
    .shake { animation: none; }
  }
</style>
</head>
<body>
<div class="ecg" aria-hidden="true"><svg viewBox="0 0 2400 92" preserveAspectRatio="none"><path id="trace"/></svg></div>

<main>
  <div class="step show" id="gate">
    <h1>Hi <em>YC</em>,</h1>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" aria-label="Password" required>
      <button id="go">Enter</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="step" id="check" role="group" aria-labelledby="q">
    <div class="box">
      <div class="top"><small id="qn">Quick check, 1 of 2</small><b id="q"></b></div>
      <div class="opts" id="opts"></div>
      <div class="nope" id="nope" role="status"></div>
      <div class="fact" id="fact"><p id="factText"></p><button id="next" type="button"></button></div>
    </div>
  </div>

  <div class="step" id="film"><video id="v" controls playsinline></video></div>
</main>

<script>
// Heartbeat trace, drawn twice the visible width so the sweep loops seamlessly
(() => {
  const beat = x => `L${x+40},56 l10,-4 l10,4 l14,0 l5,7 l8,-50 l8,58 l6,-15 l16,0 q14,-12 28,0 L${x+150},56`;
  let d = 'M0,56'; for (let x = 0; x < 2400; x += 150) d += ' ' + beat(x);
  document.getElementById('trace').setAttribute('d', d);
})();

const $ = id => document.getElementById(id);
const go = (from, to) => { $(from).classList.remove('show'); $(to).classList.add('show'); };
const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

// Download the locked film in the background, tracking progress
let pct = 0;
const locked = (async () => {
  const r = await fetch('demo.bin'); if (!r.ok) throw new Error('fetch');
  const total = +r.headers.get('content-length') || 8000000, reader = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; pct = Math.min(99, Math.round(got / total * 100)); }
  pct = 100; return new Blob(parts).arrayBuffer();
})();
locked.catch(() => {});

$('f').onsubmit = async e => {
  e.preventDefault();
  const btn = $('go'), msg = $('msg');
  btn.disabled = true; msg.className = 'msg';
  const tick = () => { msg.textContent = pct < 100 ? `Loading… ${pct}%` : ''; };
  tick(); const timer = setInterval(tick, 200);
  let blob;
  try { blob = new Uint8Array(await locked); }
  catch { clearInterval(timer); msg.className = 'msg err'; msg.textContent = 'Couldn’t load. Please refresh.'; btn.disabled = false; return; }
  clearInterval(timer); msg.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: blob.slice(0, 16), iterations: 600000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const mp4 = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
    $('v').src = URL.createObjectURL(new Blob([mp4], { type: 'video/mp4' }));
    document.body.classList.add('unlocked');
    go('gate', 'check'); ask(0);
  } catch {
    msg.className = 'msg err'; msg.textContent = 'Wrong password.';
    shake($('gate')); btn.disabled = false; $('pw').select();
  }
};

// Captcha: both answers are the doctor; each reveals one fact
const QUESTIONS = [
  { q: 'Who made this film?', fact: 'Dr. Piyush has spent <b>5,000+ hours</b> building with AI.', next: 'Next' },
  { q: 'Who built the software in it?', fact: 'Dr. Piyush led <b>medical AI strategy</b> at Redcliffe Labs (YC W21).', next: 'Play the film' },
];
const OPTIONS = [{ label: 'The medical doctor', right: true }, { label: 'The AI builder', right: false }];
const svgTick = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function ask(i) {
  const { q, fact, next } = QUESTIONS[i];
  $('qn').textContent = `Quick check, ${i + 1} of 2`; $('q').textContent = q;
  $('nope').textContent = ''; $('fact').classList.remove('show');
  $('factText').innerHTML = fact; $('next').textContent = next;
  $('opts').innerHTML = '';
  for (const o of OPTIONS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.innerHTML = `<span class="tickbox">${svgTick}</span><span>${o.label}</span>`;
    b.onclick = () => {
      if (!o.right) { b.classList.add('wrong'); $('nope').textContent = 'Try again.'; shake($('check')); return; }
      $('opts').querySelectorAll('button').forEach(x => { x.disabled = true; x.classList.remove('wrong'); });
      b.classList.add('right'); $('nope').textContent = ''; $('fact').classList.add('show');
    };
    $('opts').append(b);
  }
  $('next').onclick = () => {
    if (i + 1 < QUESTIONS.length) { $('check').classList.remove('show'); void $('check').offsetWidth; $('check').classList.add('show'); return ask(i + 1); }
    go('check', 'film'); $('v').play().catch(() => {});   // inside the click, so sound is allowed
  };
}
</script>
</body>
</html>
